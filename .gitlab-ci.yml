image: "${GITLAB_DOCKER_PROXY}/eclipse-temurin:25-jdk-alpine"

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Xmx768m -XX:MaxMetaspaceSize=384m"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"
  GITLAB_DOCKER_PROXY: "gitlab.education.tbank.ru:443/backend-academy-java-2025/lecture-materials/dependency_proxy/containers"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_REF_PROTECTED == 'true'
    - if: $CI_COMMIT_BRANCH == 'master'

stages:
  - build
  - lint
  - test

cache:
  key: "$CI_COMMIT_REF_SLUG"
  policy: pull
  paths:
    - .m2/repository/

build:
  stage: build
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - .m2/repository/
  script:
    - ./mvnw $MAVEN_CLI_OPTS package -DskipTests=true -Djacoco.skip=true

lint-ai-agent:
  stage: lint
  needs:
    - build
  script:
    - ./mvnw $MAVEN_CLI_OPTS -pl ai-agent -am compile spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check -Dspotbugs.effort=Default -Dspotbugs.threshold=High

lint-bot:
  stage: lint
  needs:
    - build
  script:
    - ./mvnw $MAVEN_CLI_OPTS -pl bot -am compile spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check -Dspotbugs.effort=Default -Dspotbugs.threshold=High

lint-scrapper:
  stage: lint
  needs:
    - build
  script:
    - ./mvnw $MAVEN_CLI_OPTS -pl scrapper -am compile spotless:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check -Dspotbugs.effort=Default -Dspotbugs.threshold=High

test-ai-agent:
  stage: test
  needs:
    - build
  script:
    - ./mvnw $MAVEN_CLI_OPTS -pl ai-agent -am test -Dtest='!**/*IntegrationTest'

test-bot:
  stage: test
  needs:
    - build
  script:
    - ./mvnw $MAVEN_CLI_OPTS -pl bot -am test -Dtest='!**/*IntegrationTest'

test-scrapper:
  stage: test
  needs:
    - build
  services:
    - name: docker:29.0.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "${DOCKER_TLS_CERTDIR}/client"
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "${GITLAB_DOCKER_PROXY}/"
  tags:
    - dind
  before_script:
    - apk add --no-cache docker-cli
    - echo "$CI_JOB_TOKEN" | docker login gitlab.education.tbank.ru:443 -u gitlab-ci-token --password-stdin || echo "docker login failed; continuing with anonymous pulls"
  script:
    - ./mvnw $MAVEN_CLI_OPTS -pl scrapper -am test -Dtest='!**/*IntegrationTest'

integration-test:
  stage: test
  needs:
    - build
  services:
    - name: docker:29.0.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "${DOCKER_TLS_CERTDIR}/client"
    TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "${GITLAB_DOCKER_PROXY}/"
  tags:
    - dind
  before_script:
    - apk add --no-cache docker-cli
    - echo "$CI_JOB_TOKEN" | docker login gitlab.education.tbank.ru:443 -u gitlab-ci-token --password-stdin || echo "docker login failed; continuing with anonymous pulls"
  script:
    - ./mvnw $MAVEN_CLI_OPTS verify -Dtest='*IntegrationTest'
  allow_failure: true
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == 'true'
